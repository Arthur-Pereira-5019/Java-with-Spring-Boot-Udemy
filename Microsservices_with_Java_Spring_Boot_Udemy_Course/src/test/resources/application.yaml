server:
  port: 8888
cors:
  originPatterns: http://localhost:8080,https://www.erudio.com.br,http://localhost:3000
spring:
  application:
    name: integration_tests
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
    show-sql: true
    open-in-view: true
logging:
  level:
    root: Warn
    com.arthur_pereira.First.REST.Endpoint: Warn
spring-doc:
  paths-to-match: /**/v1/**
  swagger-ui:
    use-root-path: true